paths:
  /health:
    get:
      operationId: health
      summary: Процесс жив
      tags:
        - system
      security: []
      responses:
        "200":
          description: Процесс жив
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health:
    get:
      operationId: healthV1
      summary: Процесс жив (путь с базой /api/v1)
      tags:
        - system
      security: []
      responses:
        "200":
          description: Процесс жив
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: ready
      summary: "Готовность: БД, миграции, MAX"
      tags:
        - system
      security: []
      responses:
        "200":
          description: Все зависимости готовы
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Какая-то зависимость не готова
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/v1/version:
    get:
      operationId: version
      summary: Версия сборки и включённые функции
      tags:
        - system
      security: []
      responses:
        "200":
          description: Версия
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/auth/max:
    post:
      operationId: authMax
      summary: Вход по initData MAX
      description: Подпись initData проверяется по алгоритму MAX (HMAC-SHA256 с ключом WebAppData), auth_date не старше часа. Ответ — сессия JWT на 12 часов.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthMaxRequest"
      responses:
        "200":
          description: Сессия
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Неверный формат запроса
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Нет или неверная авторизация
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Превышен лимит запросов
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/dev:
    post:
      operationId: authDev
      summary: Вход вне MAX для разработки
      description: Только при DEV_AUTH=true (локально). На стенде отвечает 404 независимо от клиента.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthDevRequest"
      responses:
        "200":
          description: Сессия
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Неверный формат запроса
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Не найдено (в том числе функция выключена флагом)
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Пользователь, проживание, уровень доверия, роли
      tags:
        - me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Нет или неверная авторизация
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteMe
      summary: Удалить мои данные
      description: Удаляется проживание; участие в авариях и события обезличиваются.
      tags:
        - me
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Данные удалены
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
        "401":
          description: Нет или неверная авторизация
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Нет прав
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me/consent:
    post:
      operationId: giveConsent
      summary: Согласие на обработку ПДн
      tags:
        - me
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "204":
          description: Согласие сохранено
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
        "400":
          description: Неверный формат запроса
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Нет или неверная авторизация
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Ошибка бизнес-валидации
          headers:
            X-Request-Id:
              description: Идентификатор запроса
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me/residency:
    put:
      operationId: putResidency
      summary: Дом, квартира и роль в квартире
      description: Нужно согласие (403 consent_required). Одна учётная запись MAX — одна квартира в доме; смена квартиры сбрасывает уровень доверия до 0. Квартира вне диапазона → 422 flat_out_of_range.
      tags:
        - me
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidencyRequest"
      responses:
        "200":
          description: Проживание сохранено
          headers:
            X-Request-Id:
