        - incidents
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 128
            description: Повтор с тем же ключом возвращает первый ответ
          required: false
          description: Повтор с тем же ключом возвращает первый ответ
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Авария создана
          headers:
