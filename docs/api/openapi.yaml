openapi: 3.1.0
info:
  title: Всем домом API
  version: 1.1.0
  license:
    name: MIT
    identifier: MIT
  description: |-
    REST API мини-приложения «Всем домом» и webhook бота MAX.

    - Префикс `/api/v1`, JSON, даты — ISO 8601 с часовым поясом (ответы — в UTC).
    - Авторизация: `Authorization: Bearer <session JWT>` или `Bearer <CHECKER_TOKEN_*>`.
    - Ошибки — `application/problem+json` (RFC 9457): `type`, `title`, `status`, `detail`, `code`, `traceId`.
    - Каждый ответ содержит заголовок `X-Request-Id`.
    - `Idempotency-Key` на создании аварии и расчёте — необязательный; повтор возвращает первый ответ.
    - `If-Match: <version>` на смене статуса УК — необязательный; устаревшая версия → 409 `version_conflict`.
    - Дома, УК и телефоны АДС — модельные данные.
servers:
  - url: /
    description: Тот же хост, что и мини-приложение
tags:
  - name: system
    description: Проверки и версия
  - name: auth
    description: "Вход: initData MAX, dev-вход"
  - name: me
    description: Профиль, согласие, проживание
  - name: houses
    description: Дома жителя
  - name: norms
    description: Справочник нормативов
  - name: incidents
    description: "Аварии: сообщить, присоединиться, итог, расчёт"
  - name: owner
    description: Подтверждение жильца собственником (флаг trustLevels)
  - name: uk
    description: Экран УК
  - name: demo
    description: Демо-инструменты для проверяющих (DEMO_MODE)
  - name: sandbox
    description: Дом-песочница для проверок DATA-API
  - name: webhook
    description: События бота MAX
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Сессия мини-приложения (JWT, POST /api/v1/auth/max) или тестовый токен роли CHECKER_TOKEN_* (при CHECKER_API_ENABLED=true).
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - fail
        checks:
          type: object
          additionalProperties:
            type: string
          description: "Результат по каждой зависимости: ok или причина"
      required:
        - status
        - checks
    VersionResponse:
      type: object
      properties:
        commit:
          type: string
          example: a1b2c3d
        builtAt:
          type:
            - string
            - "null"
        maxMode:
          type: string
          enum:
            - simulator
            - polling
            - webhook
        demoMode:
          type: boolean
        features:
          $ref: "#/components/schemas/FeatureFlags"
      required:
        - commit
        - builtAt
        - maxMode
        - demoMode
        - features
    FeatureFlags:
      type: object
      properties:
        keywordReply:
          type: boolean
        brigadeConfirm:
          type: boolean
        trustLevels:
          type: boolean
        joinChat:
          type: boolean
        polls:
          type: boolean
        monthlySummary:
          type: boolean
        actTemplate:
          type: boolean
      required:
        - keywordReply
        - brigadeConfirm
        - trustLevels
        - joinChat
        - polls
        - monthlySummary
        - actTemplate
      description: "Флаги функций волн 2–3: что включено в этой версии"
    SessionResponse:
      type: object
      properties:
        token:
          type: string
          description: "JWT для Authorization: Bearer; срок — 12 часов"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        user:
          $ref: "#/components/schemas/Me"
        startParam:
          type:
            - string
            - "null"
          description: "Payload запуска: n_, i_, h_, r_, a_, o_, c_"
        devAuth:
          type: boolean
          description: Вход в режиме разработки — показать баннер
      required:
        - token
        - expiresAt
        - user
        - startParam
        - devAuth
    DateTime:
      type: string
      format: date-time
      description: Дата и время ISO 8601 с часовым поясом
      example: 2026-09-27T14:40:00Z
    Me:
      type: object
      properties:
        userId:
          type: integer
          description: Идентификатор пользователя MAX
        consent:
          type:
            - object
            - "null"
          properties:
            version:
              type: string
            at:
              $ref: "#/components/schemas/DateTime"
          required:
            - version
            - at
        consentRequired:
          type: boolean
          description: Нужно (заново) дать согласие на обработку ПДн
        currentConsentVersion:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AppRole"
          description: resident — житель; uk — сотрудник УК
        residencies:
          type: array
          items:
            $ref: "#/components/schemas/Residency"
        staff:
          $ref: "#/components/schemas/StaffInfo"
        settings:
          type: object
          properties:
            notifyDefault:
              type: boolean
          required:
            - notifyDefault
        dialogActive:
          type: boolean
          description: Пользователь начал диалог с ботом — бот может писать в личку
        botLink:
          type: string
          format: uri
          description: "Ссылка на бота: https://max.ru/<бот>"
        demoMode:
          type: boolean
        features:
          $ref: "#/components/schemas/FeatureFlags"
      required:
        - userId
        - consent
        - consentRequired
        - currentConsentVersion
        - roles
        - residencies
        - staff
        - settings
        - dialogActive
        - botLink
        - demoMode
        - features
    AppRole:
      type: string
      enum:
        - resident
        - uk
    Residency:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        house:
          $ref: "#/components/schemas/HouseSummary"
        chat:
          $ref: "#/components/schemas/HouseChatInfo"
        flatNo:
          type: integer
          exclusiveMinimum: 0
        role:
          $ref: "#/components/schemas/ResidencyRole"
        trustLevel:
          $ref: "#/components/schemas/TrustLevel"
        reviewStatus:
          $ref: "#/components/schemas/ResidencyReviewStatus"
        inHouseChat:
          type:
            - boolean
            - "null"
          description: Состоит в чате дома; null — не проверено (бот не админ)
      required:
        - id
        - house
        - chat
        - flatNo
        - role
        - trustLevel
        - reviewStatus
        - inHouseChat
    PublicId:
      type: string
      pattern: ^[A-Za-z0-9]{10}$
      description: Публичный идентификатор (10 символов A-Za-z0-9)
      example: K3f9QpZ2aB
    HouseSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        label:
          type: string
          description: "Короткое имя для текстов: «Дом {label}»"
          example: "1"
        address:
          type: string
          example: ул. Модельная, 1
        city:
          type: string
        timezone:
          type: string
          description: Часовой пояс IANA; все времена показываются в нём
          example: Europe/Moscow
        entrances:
          type: integer
          exclusiveMinimum: 0
        floors:
          type: integer
          exclusiveMinimum: 0
        flatFrom:
          type: integer
          exclusiveMinimum: 0
        flatTo:
          type: integer
          exclusiveMinimum: 0
        isModel:
          type: boolean
          description: Модельные данные — показывать плашку
      required:
        - id
        - label
        - address
        - city
        - timezone
        - entrances
        - floors
        - flatFrom
        - flatTo
        - isModel
    HouseChatInfo:
      type:
        - object
        - "null"
      properties:
        bound:
          type: boolean
          description: Чат дома привязан к сервису
        title:
          type:
            - string
            - "null"
        inviteLink:
          type:
            - string
            - "null"
          description: Ссылка на чат (поле link объекта чата MAX)
        participantsCount:
          type:
            - integer
            - "null"
      required:
        - bound
        - title
        - inviteLink
        - participantsCount
    ResidencyRole:
      type: string
      enum:
        - owner
        - social_tenant
        - renter
        - family
      description: "Кто житель в квартире: owner — собственник, social_tenant — соцнаём, renter — снимает, family — член семьи"
    TrustLevel:
      anyOf:
        - type: number
          enum:
            - 0
        - type: number
          enum:
            - 1
        - type: number
          enum:
            - 2
      description: 0 — заявлено, 1 — состоит в чате дома, 2 — подтверждён собственником или УК
    ResidencyReviewStatus:
      type: string
      enum:
        - pending
        - confirmed
        - rejected
    StaffInfo:
      type:
        - object
        - "null"
      properties:
        uk:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/PublicId"
            name:
              type: string
            isModel:
              type: boolean
          required:
            - id
            - name
            - isModel
        role:
          $ref: "#/components/schemas/StaffRole"
        isDemo:
          type: boolean
          description: Роль выдана по демо-коду — плашка «Демо-роль»
        isChecker:
          type: boolean
          description: Тестовый пользователь проверяющих (дом-песочница)
      required:
        - uk
        - role
        - isDemo
        - isChecker
    StaffRole:
      type: string
      enum:
        - dispatcher
        - curator
        - admin
    Problem:
      type: object
      properties:
        type:
          type: string
          example: urn:vsemdomom:problem:not_found
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Машинный код ошибки
          example: not_found
        traceId:
          type: string
          description: Идентификатор запроса (совпадает с X-Request-Id)
      required:
        - type
        - title
        - status
        - code
        - traceId
      additionalProperties: {}
      description: Ошибка API (RFC 9457)
    AuthMaxRequest:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
          description: window.WebApp.initData как есть
      required:
        - initData
    AuthDevRequest:
      type: object
      properties:
        userId:
          type: integer
          exclusiveMinimum: 0
        role:
          $ref: "#/components/schemas/AppRole"
        startParam:
          type: string
          pattern: ^[A-Za-z0-9_-]{0,512}$
      required:
        - userId
        - role
      description: Только при DEV_AUTH=true (локально); иначе 404
    ConsentRequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          description: Должна совпадать с currentConsentVersion
      required:
        - version
    ResidencyResponse:
      type: object
      properties:
        residency:
          $ref: "#/components/schemas/Residency"
        trustReset:
          type: boolean
          description: Квартира сменилась — уровень доверия сброшен
      required:
        - residency
        - trustReset
    ResidencyRequest:
      type: object
      properties:
        houseId:
          $ref: "#/components/schemas/PublicId"
        flatNo:
          type: integer
          exclusiveMinimum: 0
        role:
          $ref: "#/components/schemas/ResidencyRole"
      required:
        - houseId
        - flatNo
        - role
      description: Квартира вне диапазона дома → 422 flat_out_of_range; смена квартиры сбрасывает уровень доверия до 0
    DemoUkRoleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
      description: Только при DEMO_MODE=true; неверный код → 403 demo_code_invalid
    SettingsResponse:
      type: object
      properties:
        notifyDefault:
          type: boolean
      required:
        - notifyDefault
    SettingsPatch:
      type: object
      properties:
        notifyDefault:
          type: boolean
      required:
        - notifyDefault
      description: "«Уведомления» в профиле: значение по умолчанию для новых аварий"
    HouseSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HouseSummary"
      required:
        - items
    HouseDetail:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        label:
          type: string
          description: "Короткое имя для текстов: «Дом {label}»"
          example: "1"
        address:
          type: string
          example: ул. Модельная, 1
        city:
          type: string
        timezone:
          type: string
          description: Часовой пояс IANA; все времена показываются в нём
          example: Europe/Moscow
        entrances:
          type: integer
          exclusiveMinimum: 0
        floors:
          type: integer
          exclusiveMinimum: 0
        flatFrom:
          type: integer
          exclusiveMinimum: 0
        flatTo:
          type: integer
          exclusiveMinimum: 0
        isModel:
          type: boolean
          description: Модельные данные — показывать плашку
        uk:
          type: object
          properties:
            name:
              type: string
            adsPhone:
              type: string
            isModel:
              type: boolean
          required:
            - name
            - adsPhone
            - isModel
        chat:
          $ref: "#/components/schemas/HouseChatInfo"
        activeIncidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummary"
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/RecentResult"
          description: Последние закрытые аварии (до 3)
        month:
          $ref: "#/components/schemas/HouseMonthSummary"
        myResidency:
          allOf:
            - $ref: "#/components/schemas/Residency"
            - type:
                - object
                - "null"
      required:
        - id
        - label
        - address
        - city
        - timezone
        - entrances
        - floors
        - flatFrom
        - flatTo
        - isModel
        - uk
        - chat
        - activeIncidents
        - recentResults
        - month
        - myResidency
    IncidentSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        house:
          $ref: "#/components/schemas/IncidentHouseRef"
        service:
          $ref: "#/components/schemas/ServiceType"
        scope:
          $ref: "#/components/schemas/IncidentScope"
        entrance:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Подъезд для масштаба entrance
        status:
          $ref: "#/components/schemas/IncidentStatus"
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        headline:
          $ref: "#/components/schemas/Headline"
        startedAt:
          $ref: "#/components/schemas/DateTime"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        eta:
          allOf:
            - $ref: "#/components/schemas/DateTime"
            - type:
                - string
                - "null"
        overdue:
          type: boolean
          description: Истёк хотя бы один срок по нормативу
        singleLimitExceeded:
          type: boolean
        discrepancyUnresolved:
          type: boolean
        participantsCount:
          type: integer
          minimum: 0
          description: Отметились «у меня тоже» (жители, включая не подтверждённых)
        flatsCount:
          type: integer
          minimum: 0
          description: Квартиры зарегистрированных участников
        byEntrance:
          type: array
          items:
            $ref: "#/components/schemas/EntranceCount"
        joined:
          type:
            - boolean
            - "null"
          description: Текущий пользователь отметился; null — для сотрудника УК
        closedAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
            - type:
                - string
                - "null"
        isModel:
          type: boolean
      required:
        - id
        - house
        - service
        - scope
        - entrance
        - status
        - displayStatus
        - headline
        - startedAt
        - createdAt
        - eta
        - overdue
        - singleLimitExceeded
        - discrepancyUnresolved
        - participantsCount
        - flatsCount
        - byEntrance
        - joined
        - closedAt
        - isModel
    IncidentHouseRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        label:
          type: string
        address:
          type: string
        timezone:
          type: string
        entrances:
          type: integer
          exclusiveMinimum: 0
        isModel:
          type: boolean
      required:
        - id
        - label
        - address
        - timezone
        - entrances
        - isModel
    ServiceType:
      type: string
      enum:
        - cold_water
        - hot_water
        - heating
        - electricity
        - sewerage
        - gas
        - leak
      description: "Вид услуги: cold_water — холодная вода, hot_water — горячая вода, heating — отопление, electricity — свет, sewerage — канализация, gas — газ, leak — протечка"
    IncidentScope:
      type: string
      enum:
        - flat
        - entrance
        - house
      description: "Где: flat — только в моей квартире (в чат не публикуется), entrance — подъезд, house — весь дом"
    IncidentStatus:
      type: string
      enum:
        - open
        - accepted
        - brigade_on_site
        - localized
        - checking
        - discrepancy
        - closed
        - merged
      description: "Статус аварии по машине состояний. Открытые: open…discrepancy; конечные: closed, merged"
    DisplayStatus:
      type: string
      enum:
        - open
        - accepted
        - brigade_on_site
        - localized
        - checking
        - discrepancy
        - closed
        - closed_with_discrepancy
        - merged
      description: "Статус для показа (девять названий): closed_with_discrepancy — «Закрыта с расхождением» (closed с флагом discrepancyUnresolved)"
    Headline:
      type: object
      properties:
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        eta:
          type:
            - string
            - "null"
          format: date-time
          description: Ориентир УК
          example: 2026-09-27T14:40:00Z
        nextDeadline:
          type:
            - object
            - "null"
          properties:
            kind:
              $ref: "#/components/schemas/DeadlineKind"
            title:
              type: string
              example: Локализовать аварию
            state:
              $ref: "#/components/schemas/DeadlineState"
            dueAt:
              $ref: "#/components/schemas/DateTime"
            warnAt:
              $ref: "#/components/schemas/DateTime"
            doneAt:
              type:
                - string
                - "null"
              format: date-time
              description: Когда срок выполнен (для met) или истёк (для breached)
              example: 2026-09-27T14:40:00Z
            anchor:
              type: string
              enum:
                - ads_registration
                - service_report
                - started
              description: "От чего отсчитан срок: ads_registration — от регистрации в АДС; service_report — от сообщения в сервисе (подпись «от регистрации в сервисе»); started — от начала аварии"
            norm:
              $ref: "#/components/schemas/NormBasis"
          required:
            - kind
            - title
            - state
            - dueAt
            - warnAt
            - doneAt
            - anchor
            - norm
          description: Ближайший невыполненный срок по нормативу
        statusAt:
          type:
            - string
            - "null"
          format: date-time
          description: "Время текущего статуса: бригада на месте, локализована, устранена или закрыта"
          example: 2026-09-27T14:40:00Z
        discrepancyFlats:
          type: integer
          minimum: 0
          description: Сколько квартир ответили «Нет» (актуально)
        unconfirmedRestoreFlats:
          type: integer
          minimum: 0
          description: "Закрыта с расхождением: у скольких квартир восстановление не подтверждено"
        durationMinutes:
          type:
            - integer
            - "null"
          minimum: 0
          description: "Для закрытой: длительность по отметке УК"
      required:
        - displayStatus
        - eta
        - nextDeadline
        - statusAt
        - discrepancyFlats
        - unconfirmedRestoreFlats
        - durationMinutes
    DeadlineKind:
      type: string
      enum:
        - answer
        - localize
        - clog
        - fix
        - single_limit
      description: answer — УК сообщит сроки работ; localize — локализовать; clog — устранить засор; fix — устранить аварию; single_limit — допустимый перерыв единовременно
    DeadlineState:
      type: string
      enum:
        - pending
        - soon
        - met
        - breached
        - cancelled
      description: pending — срок идёт; soon — до срока меньше 30 минут; met — выполнено; breached — срок истёк; cancelled — отменён
    NormBasis:
      type: object
      properties:
        code:
          type: string
          description: Код нормы в справочнике
          example: pp416.p13.localize.hot_water
        title:
          type: string
          example: Локализовать аварию
        doc:
          type: string
          example: ПП № 416
        point:
          type: string
          example: п. 13
        textPlain:
          type: string
          description: Формулировка простыми словами
        quote:
          type:
            - string
            - "null"
          description: Цитата из первоисточника
        edition:
          type: string
          format: date
          example: 2026-09-23
          description: Дата редакции документа
        validFrom:
          type: string
          format: date
          example: 2026-09-23
        validTo:
          type:
            - string
            - "null"
          format: date
          example: 2026-09-23
        checkedAt:
          type:
            - string
            - "null"
          format: date
          example: 2026-09-23
          description: Когда норма сверена с первоисточником
        sourceUrl:
          type: string
          format: uri
      required:
        - code
        - title
        - doc
        - point
        - textPlain
        - quote
        - edition
        - validFrom
        - validTo
        - checkedAt
        - sourceUrl
    EntranceCount:
      type: object
      properties:
        entrance:
          type: integer
          exclusiveMinimum: 0
        count:
          type: integer
          minimum: 0
      required:
        - entrance
        - count
    RecentResult:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        house:
          $ref: "#/components/schemas/IncidentHouseRef"
        service:
          $ref: "#/components/schemas/ServiceType"
        scope:
          $ref: "#/components/schemas/IncidentScope"
        entrance:
          type:
            - integer
            - "null"
