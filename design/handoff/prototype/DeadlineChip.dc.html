<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/colors.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/typography.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/components/max-ui.css">
  <link rel="stylesheet" href="design/handoff/tokens/app-tokens.css">
  <script src="vd-icons.js"></script>
</helmet>
<span role="img" aria-label="{{ aria }}" style="{{ chip }}">{{ ic }}<span aria-hidden="true" class="mx-t-detail" style="text-wrap:pretty">{{ text }}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:40},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;soon&quot;,&quot;expired&quot;,&quot;done&quot;,&quot;no_norm&quot;],&quot;default&quot;:&quot;soon&quot;,&quot;tsType&quot;:&quot;'normal'|'soon'|'expired'|'done'|'no_norm'&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:30&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;left&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 мин&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;at&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:10&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.VD_ICONS) { const t = setInterval(() => { if (window.VD_ICONS) { clearInterval(t); this.forceUpdate(); } }, 50); } }
  renderVals() {
    const p = this.props, st = p.state || 'normal', due = p.due || '18:30', left = p.left || '42 мин', at = p.at || due;
    const lf = left.replace(' мин', ' минут');
    const M = {
      normal: ['до ' + due + ' · осталось ' + left, 'clock', 'var(--icon-primary)', 'var(--background-tertiary)', 'var(--text-primary)', 'Срок: до ' + due + ', осталось ' + lf],
      soon: ['до ' + due + ' · осталось ' + left, 'alarm-clock', 'var(--app-warning-icon)', 'var(--app-warning-bg)', 'var(--text-primary)', 'Срок подходит: до ' + due + ', осталось ' + lf],
      expired: ['истёк в ' + at, 'circle-alert', 'var(--icon-negative)', 'var(--app-negative-bg)', 'var(--text-primary)', 'Срок по нормативу истёк в ' + at],
      done: ['выполнено в ' + at, 'check', 'var(--app-icon-positive)', 'var(--background-tertiary)', 'var(--text-primary)', 'Выполнено в ' + at],
      no_norm: ['норматив не установлен', 'minus', 'var(--icon-tertiary)', 'var(--background-tertiary)', 'var(--text-secondary)', 'Норматив не установлен']
    };
    const m = M[st] || M.normal;
    return {
      text: p.prefix ? p.prefix + ' ' + m[0] : m[0], aria: m[5],
      chip: { display: 'inline-flex', alignItems: 'center', gap: 6, minHeight: 28, padding: '4px 10px 4px 8px', borderRadius: 14, background: m[3], color: m[4], boxSizing: 'border-box', maxWidth: '100%' },
      ic: window.vdIcon ? window.vdIcon(React, m[1], 16, m[2]) : null
    };
  }
}
</script>
</body>
</html>
