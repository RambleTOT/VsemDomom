<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/colors.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/typography.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/components/max-ui.css">
  <link rel="stylesheet" href="design/handoff/tokens/app-tokens.css">
  <style>body{margin:0;background:#D9DBE1}a{color:#0068DB}a:hover{color:#004FA8}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:96px;padding:64px;font-family:-apple-system,system-ui,'Helvetica Neue',Roboto,sans-serif;color:#060708">
  <header style="display:flex;flex-direction:column;gap:8px;max-width:960px">
    <div style="font-size:15px;color:rgba(6,7,8,.68)">«Всем домом» · мини-приложение · волна 1</div>
    <h1 style="margin:0;font-size:40px;line-height:44px;font-weight:600">Состояния экранов</h1>
    <div style="font-size:17px;line-height:24px;color:rgba(6,7,8,.68)">Загрузка, пусто, ошибка, успех, частично заполнено и промежуточные шаги. Рамки — в файлах Screens 1–3, клик-прототип — <a href="Prototype.dc.html">Prototype</a></div>
    <nav style="display:flex;flex-wrap:wrap;gap:8px;padding-top:8px">
      <sc-for list="{{ screens }}" as="s" hint-placeholder-count="14"><a href="{{ s.href }}" style="padding:6px 10px;border-radius:8px;background:#fff;font-size:14px;text-decoration:none">{{ s.id }}</a></sc-for>
    </nav>
  </header>
  <sc-for list="{{ screens }}" as="s" hint-placeholder-count="3">
    <section id="{{ s.id }}" data-screen-label="{{ s.id }}" style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:baseline;gap:12px">
        <span style="padding:4px 10px;border-radius:8px;background:#060708;color:#fff;font-size:17px;font-weight:600">{{ s.id }}</span>
        <h2 style="margin:0;font-size:28px;font-weight:600">{{ s.title }}</h2>
        <span style="font-size:15px;color:rgba(6,7,8,.68)">{{ s.note }}</span>
      </div>
      <div style="display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;max-width:3000px">
        <sc-for list="{{ s.frames }}" as="fr" hint-placeholder-count="6">
          <figure style="margin:0;display:flex;flex-direction:column;gap:8px;flex-shrink:0">
            <figcaption style="font-size:14px;color:rgba(6,7,8,.68)">{{ fr.label }}</figcaption>
            <div style="{{ fr.box }}">
              <dc-import name="MiniApp" screen="{{ fr.screen }}" variant="{{ fr.variant }}" theme="{{ fr.theme }}" platform="{{ fr.platform }}" fw="{{ fr.w }}" fh="{{ fr.h }}" frame="{{ true }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
            </div>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;only&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    if (this._memo) return this._memo;
    const L = [["S00","Запуск",[["loading","Загрузка (до 3 с)"],["slow","Дольше 3 с"]]],["S01","Согласие",[["default","Согласие не дано — кнопка неактивна, причина"],["checked","Согласие дано"]]],["S02","Дом, квартира, роль",[["empty","Пусто"],["error","Квартира вне диапазона"],["default","Заполнено"]]],["S03","Мой дом",[["loading","Загрузка"],["empty","Аварий нет"],["default","Есть активная авария"]]],["S04","Сообщить об аварии",[["step1","Шаг 1 — ничего не выбрано"],["gas","Шаг 1 — газ"],["step2","Шаг 2"],["time-error","Шаг 2 — время в будущем"],["step3","Шаг 3 — подъезд не выбран"],["dup","Найдена такая же авария"],["step4","Шаг 4 — АДС"],["done","Готово"],["done-flat","Готово — только моя квартира"]]],["S05","Авария (житель)",[["loading","Загрузка"],["open","Открыта"],["brigade","Бригада на месте"],["localized","Локализована"],["skipped","Шаг пропущен"],["checking","Проверяем"],["discrepancy","Расхождение"],["closed","Закрыта"],["not-joined","Не присоединился"],["staff","Открыл сотрудник УК"]]]];
    return this._memo = { screens: L.map((g) => ({ id: g[0], title: g[1], note: 'состояния · 390 × 844 · светлая', href: '#' + g[0],
      frames: g[2].map((v) => ({ label: v[1], screen: g[0], variant: v[0], theme: 'light', platform: 'ios', w: 390, h: 844, box: { width: 390, height: 844, borderRadius: 28, overflow: 'hidden', background: '#fff', outline: '1px solid rgba(12,13,14,.16)', position: 'relative' } })) })) };
  }
}

</script>
</body>
</html>
