<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/colors.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/typography.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/tokens/sizes.css">
  <link rel="stylesheet" href="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/components/max-ui.css">
  <link rel="stylesheet" href="design/handoff/tokens/app-tokens.css">
  <script src="_ds/max-ui-design-system-b9d0190a-6dd3-40a2-821f-57fdce9dead2/_ds_bundle.js"></script>
  <script src="vd-icons.js"></script>
</helmet>
<div aria-live="polite" style="display:flex;flex-direction:column;gap:8px;min-width:0">
  <sc-if value="{{ isLoading }}">
    <div aria-label="Загрузка статуса" style="height:24px;width:70%;border-radius:8px;background:var(--background-tertiary)"></div>
  </sc-if>
  <sc-if value="{{ isBanner }}">
    <div style="display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--app-negative-bg);color:var(--text-primary)">
      {{ bannerIcon }}
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <div role="heading" aria-level="2" class="{{ hClass }}" style="text-wrap:pretty">{{ text }}</div>
        <sc-if value="{{ second }}"><div class="mx-t-detail" style="color:var(--text-primary)">{{ second }}</div></sc-if>
        <sc-if value="{{ actionLabel }}">
          <div style="display:flex;padding-top:4px"><x-import component-from-global-scope="MAXUIDesignSystem_b9d019.Button" variant="secondary" size="medium" onClick="{{ act }}" hint-size="auto,40px">{{ actionLabel }}</x-import></div>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isPlain }}" hint-placeholder-val="{{ true }}">
    <div role="heading" aria-level="2" class="{{ hClass }}" style="color:var(--text-primary);text-wrap:pretty">{{ text }}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <dc-import name="StatusBadge" status="{{ status }}" hint-size="auto,24px"></dc-import>
      <sc-if value="{{ hasDl }}"><dc-import name="DeadlineChip" state="{{ dlState }}" due="{{ dlDue }}" left="{{ dlLeft }}" at="{{ dlAt }}" prefix="{{ dlPrefix }}" hint-size="auto,28px"></dc-import></sc-if>
    </div>
    <sc-if value="{{ second }}"><div class="mx-t-detail" style="color:var(--text-secondary)">{{ second }}</div></sc-if>
    <sc-if value="{{ actionLabel }}">
      <div style="display:flex"><x-import component-from-global-scope="MAXUIDesignSystem_b9d019.Button" variant="secondary" size="medium" onClick="{{ act }}" hint-size="auto,40px">{{ actionLabel }}</x-import></div>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:140},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;accepted&quot;,&quot;brigade&quot;,&quot;localized&quot;,&quot;checking&quot;,&quot;discrepancy&quot;,&quot;closed&quot;,&quot;closed_disc&quot;,&quot;merged&quot;],&quot;default&quot;:&quot;accepted&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;regular&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;regular&quot;,&quot;tsType&quot;:&quot;'regular'|'compact'&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dlState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;soon&quot;,&quot;expired&quot;,&quot;done&quot;,&quot;no_norm&quot;,&quot;none&quot;],&quot;default&quot;:&quot;soon&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dlDue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:10&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dlLeft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 мин&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dlAt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:10&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dlPrefix&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;question&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;горячая вода вернулась?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;second&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(status:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.VD_ICONS) { const t = setInterval(() => { if (window.VD_ICONS) { clearInterval(t); this.forceUpdate(); } }, 50); } }
  renderVals() {
    const p = this.props, s = p.status || 'accepted', eta = p.eta || '18:00';
    const dl = { state: p.dlState || 'soon', due: p.dlDue || '18:10', left: p.dlLeft || '12 мин', at: p.dlAt || '18:10', prefix: p.dlPrefix };
    const T = {
      open: ['УК ещё не ответила', 'срок ответа'],
      accepted: ['УК приняла · ориентир ' + eta, 'локализовать'],
      brigade: ['Бригада на месте с ' + (p.brigadeAt || '18:05') + ' · ориентир ' + eta, 'локализовать'],
      localized: ['Авария локализована в ' + (p.localizedAt || '18:20') + ' · ориентир ' + eta, 'устранить'],
      checking: ['Проверяем: ' + (p.question || 'горячая вода вернулась?'), null],
      discrepancy: ['У ' + (p.count || 3) + ' квартир нет ' + (p.serviceGen || 'горячей воды'), null],
      closed: ['Закрыта · ' + (p.dur || '1 ч 30 мин') + ' по отметке УК', null],
      closed_disc: ['Закрыта · у ' + (p.count || 2) + ' квартир восстановление не подтверждено', null],
      merged: ['Объединена с другой аварией', null]
    };
    const t = T[s] || T.open;
    const compact = p.density === 'compact';
    const banner = s === 'discrepancy';
    const defAction = { discrepancy: 'Что делать', merged: 'Открыть актуальную' }[s];
    return {
      isLoading: !!p.loading, isBanner: !p.loading && banner, isPlain: !p.loading && !banner,
      status: s, text: t[0], hClass: compact ? 'mx-t-title' : 'mx-t-subheader',
      hasDl: !!t[1] && p.dlState !== 'none',
      dlState: dl.state, dlDue: dl.due, dlLeft: dl.left, dlAt: dl.at, dlPrefix: dl.prefix != null ? dl.prefix : t[1],
      second: p.second || (banner ? 'УК отметила устранение в ' + (p.resolvedAt || '19:10') : ''),
      actionLabel: compact ? '' : (p.actionLabel != null ? p.actionLabel : defAction || ''),
      act: () => p.onAction && p.onAction(s),
      bannerIcon: window.vdIcon ? window.vdIcon(React, 'triangle-alert', 24, 'var(--icon-negative)') : null
    };
  }
}
</script>
</body>
</html>
