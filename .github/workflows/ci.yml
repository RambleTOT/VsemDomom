name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линтер, типы, тесты, контракт
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm через corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: openapi.yaml совпадает со сгенерированным
        run: pnpm openapi:check
      - name: Лицензии зависимостей
        run: pnpm license-check
      - name: Уязвимости (high и critical блокируют)
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Секреты (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Сборка образов (порог 300 с)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose build --no-cache с замером времени
        run: |
          docker compose pull db
          start=$(date +%s)
          GIT_COMMIT=${GITHUB_SHA::7} docker compose build --no-cache
          elapsed=$(( $(date +%s) - start ))
          echo "Сборка заняла ${elapsed} с"
          if [ "$elapsed" -gt 300 ]; then echo "::error::Сборка дольше 300 с"; exit 1; fi
      - name: Подъём и проверка /health, /ready
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/api/v1/version
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --no-color
      - name: Остановка
        if: always()
        run: docker compose down -v
